# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
# ==============================================================================
# llama-swap Configuration
# Host: Arch Linux | GPU: AMD Radeon RX 5700 XT (8GB VRAM / Vulkan) | CPU: Ryzen 3700X
# ==============================================================================

# Global settings
healthCheckTimeout: 180
logLevel: info
logToStdout: "proxy"

# Automatically unload models after 180 seconds (3 mins) of idle time to free 8GB VRAM
globalTTL: 180

# Common macros across models
macros:
  "gpu_args": "--threads 8 --n-gpu-layers 99 --flash-attn"
  "models_dir": "/models"

# ==============================================================================
# Models & Modalities Matrix
# ==============================================================================
models:

  # ----------------------------------------------------------------------------
  # 1. Primary Brain: Agentic Coding, Reasoning, Vision & Video
  # ----------------------------------------------------------------------------
  "tiel-coder":
    name: "Tiel Coder 35B MoE (Genesis Hermes)"
    description: "35B-A3B MoE agentic coding & reasoning engine with vision/video support"
    capabilities:
      in: [text, image, video]
      out: [text]
      tools: true
      context: 16384
    aliases:
      - "hermes"
      - "coder"
      - "gpt-4o"  # impersonate for clients expecting OpenAI model names
    filters:
      # Enforce Hermes Agent optimal sampling parameters
      setParams:
        temperature: 0.6
        top_p: 1.0
        top_k: 20
        repeat_penalty: 1.05
    cmd: |
      llama-server
      --host 0.0.0.0 --port ${PORT}
      ${gpu_args}
      --ctx-size 16384
      --cache-type-k f16 --cache-type-v f16
      --jinja
      --model ${models_dir}/Tiel-Coder-35B-A3B-Genesis-Hermes-APEX-Compact.gguf
      --mmproj ${models_dir}/mmproj-Tiel-Coder-35B-A3B-Genesis-Hermes-BF16.gguf

  # ----------------------------------------------------------------------------
  # 2. Voice Input (Speech-to-Text / STT)
  # ----------------------------------------------------------------------------
  "whisper-turbo":
    name: "Whisper Large v3 Turbo"
    description: "Fast multi-language speech-to-text transcription"
    capabilities:
      in: [audio]
      out: [text]
    aliases:
      - "whisper"
      - "whisper-1"
    cmd: |
      whisper-server
      --port ${PORT}
      --model ${models_dir}/whisper-large-v3-turbo-Q4_K_M.gguf
      --language auto

  # ----------------------------------------------------------------------------
  # 3. Voice Output (Text-to-Speech / TTS)
  # ----------------------------------------------------------------------------
  "kokoro-tts":
    name: "Kokoro 82M TTS"
    description: "Ultra-low latency natural voice synthesis"
    capabilities:
      in: [text]
      out: [audio]
    aliases:
      - "tts-1"
      - "speech"
    cmd: |
      audiocpp_server
      --port ${PORT}
      --task tts
      --family kokoro_tts
      --model ${models_dir}/kokoro-82m-bf16.gguf

  # ----------------------------------------------------------------------------
  # 4. Image Generation (Text-to-Image / Juggernaut XL SDXL)
  # ----------------------------------------------------------------------------
  "image-gen":
    name: "Juggernaut XL v9"
    description: "High quality photorealistic text-to-image generator (SDXL)"
    capabilities:
      in: [text]
      out: [image]
    aliases:
      - "dall-e-3"
      - "sdxl"
      - "juggernaut"
    cmd: |
      sd-server
      --port ${PORT}
      --model ${models_dir}/juggernaut-xl-v9-Q4_K.gguf
