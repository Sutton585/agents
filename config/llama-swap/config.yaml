# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
logLevel: debug
logToStdout: "both"
healthCheckTimeout: 180

models:
  "Gemma4-E4B":
    name: "Gemma 4 E4B (Uncensored)"
    cmd: |
      llama-server
      --host 0.0.0.0
      --port ${PORT}
      --model /models/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive-IQ4_XS.gguf
      --n-gpu-layers 99
      --threads 8
      --ctx-size 8192

  "tiel-coder":
    name: "Tiel Coder 35B MoE (Genesis Hermes)"
    description: "35B-A3B MoE agentic coding & reasoning engine with vision/video support"
    capabilities:
      in: [text, image, video]
      out: [text]
      tools: true
      context: 131072
    aliases:
      - "hermes"
      - "coder"
      - "gpt-4o"
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        repeat_penalty: 1.05
    cmd: |
      llama-server
      --host 0.0.0.0
      --port ${PORT}
      --threads 8
      --n-gpu-layers 99
      --ctx-size 131072
      --cache-type-k q4_0
      --cache-type-v q4_0
      --jinja
      --model /models/Tiel-Coder-35B-A3B-Genesis-Hermes-APEX-Compact.gguf
      --mmproj /models/mmproj-Tiel-Coder-35B-A3B-Genesis-Hermes-BF16.gguf
