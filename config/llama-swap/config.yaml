# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
logLevel: debug
logToStdout: "both"
healthCheckTimeout: 180
globalTTL: 180

models:
  # ----------------------------------------------------------------------------
  # 1. Fallback Brain (Fast & Lightweight)
  # ----------------------------------------------------------------------------
  "Gemma4-E4B":
    name: "Gemma 4 E4B (Uncensored)"
    description: "Fast 4B parameter general purpose model"
    capabilities:
      in: [text]
      out: [text]
    cmd: |
      llama-server
      --host 0.0.0.0
      --port ${PORT}
      --model /models/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive-IQ4_XS.gguf
      --n-gpu-layers 99
      --threads 8
      --ctx-size 8192

  # ----------------------------------------------------------------------------
  # 2. Primary Brain (Agentic Reasoning, Coding, Vision & Video)
  # ----------------------------------------------------------------------------
  "tiel-coder":
    name: "Tiel Coder 35B MoE (Genesis Hermes)"
    description: "35B-A3B MoE agentic coding & reasoning engine with vision/video support"
    capabilities:
      in: [text, image, video]
      out: [text]
      tools: true
      context: 131072
    aliases:
      - "hermes"
      - "coder"
      - "gpt-4o"
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        repeat_penalty: 1.05
    cmd: |
      llama-server
      --host 0.0.0.0
      --port ${PORT}
      --threads 8
      --n-gpu-layers 99
      --ctx-size 131072
      --cache-type-k q4_0
      --cache-type-v q4_0
      --jinja
      --model /models/Tiel-Coder-35B-A3B-Genesis-Hermes-APEX-Compact.gguf
      --mmproj /models/mmproj-Tiel-Coder-35B-A3B-Genesis-Hermes-BF16.gguf

  # ----------------------------------------------------------------------------
  # 3. Voice Input (Speech-to-Text / STT via Qwen3-ASR & Moonshine)
  # ----------------------------------------------------------------------------
  "qwen3-asr":
    name: "Qwen3 ASR 0.6B"
    description: "Alibaba 2026 Multilingual Speech Recognition"
    capabilities:
      in: [audio]
      out: [text]
    aliases:
      - "whisper"
      - "whisper-1"
      - "stt"
    cmd: |
      audiocpp_server
      --config /etc/llama-swap/config/audio-server.json
      --host 0.0.0.0
      --port ${PORT}
      --backend vulkan

  "moonshine-asr":
    name: "Moonshine Streaming Medium"
    description: "Ultra-low latency streaming speech-to-text"
    capabilities:
      in: [audio]
      out: [text]
    cmd: |
      audiocpp_server
      --config /etc/llama-swap/config/audio-server.json
      --host 0.0.0.0
      --port ${PORT}
      --backend vulkan

  # ----------------------------------------------------------------------------
  # 4. Voice Output (Text-to-Speech / TTS via Supertonic-3)
  # ----------------------------------------------------------------------------
  "supertonic-tts":
    name: "Supertonic 3 TTS"
    description: "Ultra-fast zero-dependency speech synthesis with built-in voice presets (M1, M2, F1, F2)"
    capabilities:
      in: [text]
      out: [audio]
    aliases:
      - "tts-1"
      - "speech"
      - "kokoro-tts"
      - "qwen-tts"
    cmd: |
      audiocpp_server
      --config /etc/llama-swap/config/audio-server.json
      --host 0.0.0.0
      --port ${PORT}
      --backend vulkan

  # ----------------------------------------------------------------------------
  # 5. Image Generation (Text-to-Image / Juggernaut XL SDXL)
  # ----------------------------------------------------------------------------
  "image-gen":
    name: "Juggernaut XL v9"
    description: "High quality photorealistic text-to-image generator (SDXL)"
    capabilities:
      in: [text]
      out: [image]
    aliases:
      - "dall-e-3"
      - "sdxl"
      - "juggernaut"
    checkEndpoint: "none"
    cmd: |
      sd-server
      --listen-ip 0.0.0.0
      --listen-port ${PORT}
      --threads 8
      --force-sdxl-vae-conv-scale
      --model /models/juggernaut-xl-v9-Q4_K.gguf
